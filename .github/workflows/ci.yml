name: CI/CD
on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          
      - name: Create Tag
        id: create_tag
        uses: jaywcjlove/create-tag-action@main
        with:
          test: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Create Released Tag
        uses: jaywcjlove/create-tag-action@main
        with:
          version: ${{ steps.create_tag.outputs.version }}
          release: true
          body: |
            <a target="_blank" href="https://jaywcjlove.github.io/maslink/?id=6758053530" title="GerminationDiary for macOS">
              <img alt="GerminationDiary AppStore" src="https://jaywcjlove.github.io/sb/download/macos.svg" height="51">
            </a>

      - name: Get latest tag
        id: get_latest_tag
        run: echo "LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_ENV

      - name: Create idoc config.
        run: |
          cat > idoc.yml << EOF
          site: "Sprout Diary {{version:${{ steps.create_tag.outputs.version }}}}"
          description: Sprout Diary is a parenting app designed for families with babies aged 0-3. It helps parents and caregivers record feeding, diaper logs, sleep, body status, and growth development in a structured timeline.
          keywords: parenting, baby care, feeding, diaper logs, sleep tracking, growth development, childcare, family app
          favicon: assets/logo.png
          logo: ./assets/logo.png
          openSource: https://github.com/hy916/GerminationDiary
          tocs: false
          element: 
            wrapper: style=max-width:720px;
          menus:
            Home: index.html
            About: https://github.com/hy916
          sideEffectFiles:
            - README.md
            - README.zh.md
            - docs/CHANGELOG.md
            - docs/CHANGELOG.zh.md
            - docs/feedback.md
            - docs/feedback.zh.md
            - docs/terms-of-service.md
            - docs/terms-of-service.zh.md
            - docs/privacy-policy.md
            - docs/privacy-policy.zh.md
          footer: |
            Generated by <a href="https://github.com/jaywcjlove/idoc" target="_blank">idoc</a> v{{idocVersion}}          
          EOF
      - run: npm install idoc@1 -g
      - run: idoc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          commit_message: ${{ github.event.head_commit.message }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

